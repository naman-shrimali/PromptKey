document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

74-e793-4298-9a02-09fed599e2d0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\nbody{margin:0}\na{color:#7C5CFC}a:hover{color:#5b3fe0}\n.pk{--acc:var(--pk-accent,#7C5CFC);--bg:#FAF8F3;--card:#FFFFFF;--ink:#241F36;--mut:#6E6884;--line:#E7E2D6;--soft:#F2EEE4;--accSoft:color-mix(in srgb,var(--acc) 11%,var(--card));--accLine:color-mix(in srgb,var(--acc) 40%,var(--line))}\n.pk[data-pk-t=\"dark\"]{--bg:#151220;--card:#201B31;--ink:#F1EEFA;--mut:#9C94B8;--line:#342D4C;--soft:#272138;--accSoft:color-mix(in srgb,var(--acc) 16%,var(--card));--accLine:color-mix(in srgb,var(--acc) 45%,var(--line))}\n@keyframes pkPop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}\n@keyframes pkFlip{0%{opacity:0;transform:perspective(700px) rotateY(80deg) scale(.85)}60%{opacity:1;transform:perspective(700px) rotateY(-10deg) scale(1.04)}100%{opacity:1;transform:none}}\n@keyframes pkConf{0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}100%{opacity:0;transform:translate(var(--dx,30px),var(--dy,-80px)) rotate(320deg) scale(.6)}}\n@keyframes pkShimmer{0%{background-position:-260px 0}100%{background-position:260px 0}}\n@keyframes pkCaret{50%{opacity:0}}\n@keyframes pkWiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"pk\" data-pk-t=\"{{ theme }}\" style=\"min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;transition:background .35s,color .35s\">\n\n  <!-- ============ HEADER ============ -->\n  <header style=\"display:flex;align-items:center;gap:10px;max-width:1060px;margin:0 auto;padding:20px 28px 8px\">\n    <div style=\"display:flex;align-items:center;gap:10px;cursor:pointer\" sc-camel-on-click=\"{{ goMake }}\">\n      <div style=\"width:38px;height:38px;border-radius:12px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 35%,transparent);animation:pkWiggle 5s ease-in-out infinite\">🔑<\u002Fdiv>\n      <div style=\"font:700 22px 'Baloo 2',cursive;letter-spacing:.2px\">PromptKey<\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display:flex;gap:4px;margin-left:22px\">\n      <button sc-camel-on-click=\"{{ goMake }}\" style=\"{{ makeTabStyle }}\">Make<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goLib }}\" style=\"{{ libTabStyle }}\">Library<\u002Fbutton>\n    <\u002Fnav>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" title=\"Toggle dark mode\" style=\"width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;transition:transform .2s\" style-hover=\"transform:rotate(-16deg) scale(1.08);border-color:var(--accLine)\">{{ themeIcon }}<\u002Fbutton>\n      <button style=\"border:none;background:var(--soft);color:var(--ink);font:600 14px 'Nunito Sans',sans-serif;padding:9px 18px;border-radius:99px;cursor:pointer;transition:background .2s\" style-hover=\"background:var(--accSoft)\">Log in<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ MAKE SCREEN ============ -->\n  <sc-if value=\"{{ f.make }}\" hint-placeholder-val=\"{{ true }}\">\n  <main data-screen-label=\"Generator\" style=\"max-width:760px;margin:0 auto;padding:34px 28px 80px\">\n    <h1 style=\"font:600 clamp(28px,4.5vw,40px)/1.15 'Baloo 2',cursive;margin:0 0 6px;text-align:center\">Paste it. <span style=\"color:var(--acc)\">QR it.<\u002Fspan> Share it.<\u002Fh1>\n    <p style=\"margin:0 0 26px;text-align:center;color:var(--mut);font-size:15.5px\">Long text in, tiny scannable link out — encrypted, no account needed.<\u002Fp>\n\n    <div style=\"position:relative\">\n      <textarea value=\"{{ text }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Paste your prompt, notes, or that 4,000-character system message…\" style=\"width:100%;box-sizing:border-box;min-height:180px;resize:vertical;padding:18px 18px 40px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:400 15px/1.55 'Nunito Sans',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s\" style-focus=\"border-color:var(--acc);box-shadow:0 0 0 4px var(--accSoft)\"><\u002Ftextarea>\n      <div style=\"position:absolute;left:16px;bottom:14px;display:flex;gap:8px;align-items:center\">\n        <sc-if value=\"{{ f.detect }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;font-weight:700;color:var(--acc);background:var(--accSoft);border-radius:99px;padding:3px 10px;animation:pkPop .3s ease\">{{ detectLabel }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"position:absolute;right:16px;bottom:14px;font-size:12.5px;color:var(--mut)\">{{ charCount }} / 100k<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- feature pills -->\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;justify-content:center\">\n      <button sc-camel-on-click=\"{{ cycleExpiry }}\" title=\"Link expiry\" style=\"border:1.5px solid var(--accLine);background:var(--accSoft);color:var(--ink);font:600 13px 'Nunito Sans',sans-serif;padding:7px 14px;border-radius:99px;cursor:pointer\">⏳ {{ expiryLabel }}<\u002Fbutton>\n\n      <sc-if value=\"{{ f.once }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ toggleOnce }}\" style=\"border:1.5px solid var(--accLine);background:var(--accSoft);color:var(--ink);font:600 13px 'Nunito Sans',sans-serif;padding:7px 14px;border-radius:99px;cursor:pointer\">👁 one-time ✓<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ nf.once }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ toggleOnce }}\" style=\"border:1.5px solid var(--lin 1px)\">＋ New<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px\">\n      <sc-for list=\"{{ items }}\" as=\"it\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ it.onOpen }}\" style=\"background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;animation:pkPop .4s ease backwards\" style-hover=\"border-color:var(--accLine);transform:translateY(-3px);box-shadow:0 10px 26px color-mix(in srgb,var(--acc) 10%,transparent)\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start\">\n            <div style=\"flex:none;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px;color:#1a1530\">{{ it.qr }}<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font:700 14.5px 'Nunito Sans',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ it.title }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:var(--mut);margin-top:3px\">{{ it.meta }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:8px\">\n                <span style=\"font-size:11px;letter-spacing:1px;color:var(--acc)\">{{ it.spark }}<\u002Fspan>\n                <span style=\"font-size:12px;color:var(--mut)\">{{ it.scans }} scans<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ it.onFav }}\" title=\"Favorite\" style=\"border:none;background:transparent;font-size:17px;cursor:pointer;padding:2px;line-height:1;transition:transform .15s\" style-hover=\"transform:scale(1.25)\">{{ it.star }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ it.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--line);animation:pkPop .25s ease\">\n              <div style=\"font:400 12.5px/1.55 ui-monospace,Menlo,monospace;color:var(--mut);background:var(--soft);border-radius:10px;padding:10px;max-height:80px;overflow:hidden;white-space:pre-wrap\">{{ it.preview }}<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;margin-top:10px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ it.onCopyText }}\" style=\"flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 12px 'Nunito Sans',sans-serif;padding:7px 0;border-radius:8px;cursor:pointer\" style-hover=\"border-color:var(--accLine);background:var(--accSoft)\">Copy text<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ it.onCopyUrl }}\" style=\"flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 12px 'Nunito Sans',sans-serif;padding:7px 0;border-radius:8px;cursor:pointer\" style-hover=\"border-color:var(--accLine);background:var(--accSoft)\">Copy URL<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ it.onEdit }}\" style=\"flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 12px 'Nunito Sans',sans-serif;padding:7px 0;border-radius:8px;cursor:pointer\" style-hover=\"border-color:var(--accLine);background:var(--accSoft)\">Edit ✏️<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ it.onDelete }}\" style=\"flex:1;border:1.5px solid var(--line);background:var(--card);color:#E5484D;font:600 12px 'Nunito Sans',sans-serif;padding:7px 0;border-radius:8px;cursor:pointer\" style-hover=\"border-color:#E5484D\">Delete<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--mut);margin-top:8px\">{{ it.lastScan }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ f.empty }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;color:var(--mut);padding:60px 0;font-size:15px\">Nothing here yet — <button sc-camel-on-click=\"{{ goMake }}\" style=\"border:none;background:transparent;color:var(--acc);font:700 15px 'Nunito Sans',sans-serif;cursor:pointer;padding:0;text-decoration:underline\">make your first QR<\u002Fbutton> ✨<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- toast -->\n  <sc-if value=\"{{ f.toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 13.5px 'Nunito Sans',sans-serif;padding:11px 22px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pkPop .25s ease;z-index:50\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7C5CFC&quot;,&quot;options&quot;:[&quot;#7C5CFC&quot;,&quot;#FF6B5E&quot;,&quot;#0FA47A&quot;,&quot;#F59E0B&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;celebrations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;startDark&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'make', dark: null, text: '', expiry: 0, once: false, pass: false,\n    slugOn: false, slugDraft: '', tidy: false, generated: null, stale: false,\n    celebrating: false, error: '', copiedUrl: false, copiedAll: false,\n    scanCount: 12, decrypting: false, revealed: '', raw: true,\n    query: '', favFilter: false, openId: null, toast: '',\n    lib: [\n      { id: 1, title: 'Midjourney portrait style guide', slug: 'mj-portrait', scans: 12, spark: '▁▃▂▅▇', fav: true, ago: '2d ago', last: 'Last scan 2h ago · Android · Berlin', text: 'Ultra-detailed studio portrait, 85mm lens, soft rim lighting, muted earth tones, shallow depth of field --ar 4:5 --v 6' },\n      { id: 2, title: 'Customer support system prompt', slug: 'support-sys', scans: 34, spark: '▂▅▇▆▇', fav: false, ago: '5d ago', last: 'Last scan 40m ago · iOS · Austin', text: 'You are a friendly support agent for Acme. Always greet the user, confirm their issue in one sentence, and offer the top 2 solutions before escalating.' },\n      { id: 3, title: 'Weekly standup notes template', slug: 'standup', scans: 6, spark: '▁▁▂▁▃', fav: false, ago: '1w ago', last: 'Last scan yesterday · Desktop · Remote', text: 'Yesterday:\\n- \\nToday:\\n- \\nBlockers:\\n- ' },\n      { id: 4, title: 'SQL query for churn cohort', slug: 'churn-sql', scans: 21, spark: '▃▂▆▅▇', fav: true, ago: '2w ago', last: 'Last scan 3d ago · Desktop · NYC', text: 'SELECT user_id, cohort_month, COUNT(*) FROM events WHERE ...' }\n    ]\n  };\n\n  componentDidMount() { this.applyAccent(); }\n  componentDidUpdate() { this.applyAccent(); }\n  applyAccent() {\n    const a = this.props.accent ?? '#7C5CFC';\n    document.documentElement.style.setProperty('--pk-accent', a);\n  }\n\n  hashRng(str) {\n    let h = 2166136261;\n    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }\n    return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };\n  }\n\n  qrEl(seed, size) {\n    const n = 21, rng = this.hashRng(seed || 'promptkey');\n    const cells = [];\n    const finder = (x, y) => {\n      for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) {\n        const ring = Math.max(Math.abs(i - 3), Math.abs(j - 3));\n        if (ring !== 2) cells.push([x + j, y + i]);\n      }\n    };\n    const inFinder = (x, y) => (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);\n    finder(0, 0); finder(14, 0); finder(0, 14);\n    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {\n      if (inFinder(x, y)) continue;\n      if (y === 6 || x === 6) { if ((x + y) % 2 === 0) cells.push([x, y]); continue; }\n      if (rng() < 0.46) cells.push([x, y]);\n    }\n    const d = cells.map(([x, y]) => `M${x} ${y}h1v1h-1z`).join('');\n    return React.createElement('svg', { viewBox: '0 0 21 21', width: size, height: size, style: { display: 'block' } },\n      React.createElement('path', { d, fill: 'currentColor' }));\n  }\n\n  showToast(msg) {\n    clearTimeout(this._tt);\n    this.setState({ toast: msg });\n    this._tt = setTimeout(() => this.setState({ toast: '' }), 2200);\n  }\n\n  copy(text, msg, key) {\n    try { navigator.clipboard.writeText(text); } catch (e) {}\n    if (key) { this.setState({ [key]: true }); setTimeout(() => this.setState({ [key]: false }), 1800); }\n    if (msg) this.showToast(msg);\n  }\n\n  doGenerate() {\n    const t = this.state.text.trim();\n    if (t.length < 12) { this.setState({ error: 'That’s a bit short — paste at least a sentence or two ✍️' }); return; }\n    const slug = this.state.slugOn && this.state.slugDraft.trim()\n      ? this.state.slugDraft.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-')\n      : Array.from({ length: 5 }, () => '23456789abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random() * 51)]).join('');\n    this.setState({ generated: { slug, text: t }, stale: false, error: '', celebrating: this.props.celebrations ?? true });\n    clearTimeout(this._ct);\n    this._ct = setTimeout(() => this.setState({ celebrating: false }), 1300);\n  }\n\n  startScan() {\n    this.setState({ screen: 'scan', decrypting: true, revealed: '', scanCount: this.state.scanCount + 1, raw: true });\n    clearTimeout(this._dt); clearInterval(this._ti);\n    this._dt = setTimeout(() => {\n      this.setState({ decrypting: false });\n      const full = (this.state.generated && this.state.generated.text) || this.state.lib[1].text;\n      let i = 0;\n      this._ti = setInterval(() => {\n        i = Math.min(full.length, i + 7);\n        this.setState({ revealed: full.slice(0, i) });\n        if (i >= full.length) clearInterval(this._ti);\n      }, 16);\n    }, 750);\n  }\n\n  componentWillUnmount() { clearTimeout(this._tt); clearTimeout(this._ct); clearTimeout(this._dt); clearInterval(this._ti); }\n\n  renderVals() {\n    const s = this.state;\n    const dark = s.dark === null ? false : s.dark;\n    const expiries = ['7 days', '24 hours', '30 days', 'forever'];\n    const t = s.text;\n    let detectLabel = '';\n    if (/```|SELECT |function |=>|const |import /.test(t)) detectLabel = '⌨️ looks like code';\n    else if (/^https?:\\/\\/\\S+$/.test(t.trim()) && t.trim()) detectLabel = '🔗 looks like a URL';\n    else if (t.length > 400) detectLabel = '🧠 big prompt detected';\n\n    const q = s.query.toLowerCase();\n    const items = s.lib\n      .filter(it => (!s.favFilter || it.fav) && (!q || it.title.toLowerCase().includes(q) || it.text.toLowerCase().includes(q)))\n      .map(it => ({\n        ...it,\n        meta: `pk.ey/${it.slug} · ${it.ago}`,\n        star: it.fav ? '⭐' : '☆',\n        open: s.openId === it.id,\n        preview: it.text.slice(0, 160),\n        lastScan: it.last,\n        qr: this.qrEl(it.slug, 54),\n        onOpen: () => this.setState({ openId: s.openId === it.id ? null : it.id }),\n        onFav: (e) => { e.stopPropagation(); this.setState({ lib: s.lib.map(x => x.id === it.id ? { ...x, fav: !x.fav } : x) }); },\n        onCopyText: (e) => { e.stopPropagation(); this.copy(it.text, 'Text copied 📋'); },\n        onCopyUrl: (e) => { e.stopPropagation(); this.copy('https://pk.ey/' + it.slug, 'URL copied 🔗'); },\n        onEdit: (e) => { e.stopPropagation(); this.setState({ screen: 'make', text: it.text, generated: { slug: it.slug, text: it.text }, stale: false }); },\n        onDelete: (e) => { e.stopPropagation(); this.setState({ lib: s.lib.filter(x => x.id !== it.id) }); this.showToast('Deleted — undo? (demo)'); }\n      }));\n\n    const tabBase = { border: 'none', font: \"600 14px 'Nunito Sans',sans-serif\", padding: '8px 18px', borderRadius: 99, cursor: 'pointer', transition: 'background .2s,color .2s' };\n    const tabOn = { ...tabBase, background: 'var(--accSoft)', color: 'var(--ink)', boxShadow: 'inset 0 0 0 1.5px var(--accLine)' };\n    const tabOff = { ...tabBase, background: 'transparent', color: 'var(--mut)' };\n\n    return {\n      theme: dark ? 'dark' : 'light',\n      themeIcon: dark ? '☀️' : '🌙',\n      toggleTheme: () => this.setState({ dark: !dark }),\n      makeTabStyle: s.screen === 'make' ? tabOn : tabOff,\n      libTabStyle: s.screen === 'lib' ? tabOn : tabOff,\n      goMake: () => this.setState({ screen: 'make' }),\n      goLib: () => this.setState({ screen: 'lib' }),\n      goScan: () => this.startScan(),\n\n      f: {\n        make: s.screen === 'make', scan: s.screen === 'scan', lib: s.screen === 'lib',\n        detect: !!detectLabel, once: s.once, pass: s.pass, slug: s.slugOn, tidy: s.tidy,\n        generated: !!s.generated, confetti: s.celebrating, stale: s.stale, error: !!s.error,\n        decrypting: s.decrypting, raw: s.raw, favs: s.favFilter, toast: !!s.toast,\n        empty: s.screen === 'lib' && items.length === 0\n      },\n      nf: {\n        once: !s.once, pass: !s.pass, slug: !s.slugOn, tidy: !s.tidy,\n        decrypting: !s.decrypting, raw: !s.raw, favs: !s.favFilter\n      },\n\n      text: s.text,\n      onText: (e) => this.setState({ text: e.target.value, stale: !!s.generated && e.target.value.trim() !== (s.generated && s.generated.text) }),\n      charCount: s.text.length.toLocaleString(),\n      detectLabel,\n      expiryLabel: expiries[s.expiry],\n      cycleExpiry: () => this.setState({ expiry: (s.expiry + 1) % expiries.length }),\n      toggleOnce: () => this.setState({ once: !s.once }),\n      togglePass: () => this.setState({ pass: !s.pass }),\n      toggleSlug: () => this.setState({ slugOn: !s.slugOn }),\n      toggleTidy: () => this.setState({ tidy: !s.tidy }),\n      slugDraft: s.slugDraft,\n      onSlugDraft: (e) => this.setState({ slugDraft: e.target.value }),\n      generate: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.doGenerate(); },\n      generateLabel: s.generated ? 'Regenerate ↻' : 'Make my QR →',\n      errorMsg: s.error,\n\n      slug: s.generated ? s.generated.slug : 'x7Kq2',\n      qrSvg: this.qrEl(s.generated ? s.generated.slug + s.generated.text : 'pk', 148),\n      copyUrl: () => this.copy('https://pk.ey/' + (s.generated ? s.generated.slug : ''), '', 'copiedUrl'),\n      copyUrlLabel: s.copiedUrl ? 'Copied ✓' : 'Copy',\n      dlPng: () => this.showToast('QR downloaded as PNG 🖼️ (demo)'),\n      dlSvg: () => this.showToast('QR downloaded as SVG ✒️ (demo)'),\n      dlPdf: () => this.showToast('PDF sheet exported 📄 (demo)'),\n      share: () => this.showToast('Share sheet opened ↗ (demo)'),\n      nudgeSave: (e) => { e.preventDefault(); this.showToast('Sign-up flow — Google or email OTP (demo)'); },\n\n      scanCount: s.scanCount,\n      revealedText: s.revealed,\n      toRaw: () => this.setState({ raw: true }),\n      toMd: () => this.setState({ raw: false }),\n      copyAll: () => this.copy(s.revealed, '', 'copiedAll'),\n      copyAllLabel: s.copiedAll ? 'Copied ✓ Ready to paste' : 'Copy all 📋',\n      openAi: () => this.showToast('Would open with text pre-filled ↗ (demo)'),\n\n      query: s.query,\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      toggleFavFilter: () => this.setState({ favFilter: !s.favFilter }),\n      items,\n      toast: s.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
